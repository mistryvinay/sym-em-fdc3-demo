<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Native FDC3 action buttons</title>
    <link rel="stylesheet" href="../../styles.css">
    <style>
      body { height: auto; overflow: auto; }
      main.demo {
        display: block;
        height: auto;
        max-width: 1120px;
        margin: auto;
        padding: clamp(16px, 4vw, 40px);
        overflow: visible;
      }
      h1 { margin: 0 0 8px; font-size: clamp(1.6rem, 4vw, 2.2rem); }
      h2 { margin: 0 0 12px; font-size: 1.1rem; }
      p { color: var(--muted); margin: 0 0 16px; }
      .demo .panel { margin-top: 16px; padding: 16px; box-shadow: none; }
      .demo fieldset {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(min(100%, 180px), 1fr));
        gap: 12px;
        min-width: 0;
        border: 0;
        margin: 0 0 12px;
        padding: 0;
      }
      .demo label { font-size: .9rem; font-weight: 600; }
      .demo input:not([type="checkbox"]) {
        width: 100%;
        margin-top: 6px;
        border: 1px solid var(--line-strong);
        border-radius: 6px;
        padding: 9px;
      }
      .actions { display: flex; flex-wrap: wrap; gap: 8px; }
      .demo button { min-height: 42px; transition: none; }
      .demo button:active { transform: none; }
      .demo output { color: var(--muted); }
      .demo output[data-tone="error"] { color: var(--red); }
      #action-status:not(:empty) { display: block; margin-top: 12px; }
      .setup-status { display: inline-block; margin: 0 4px; align-self: center; }
      .relay { display: flex; align-items: center; gap: 6px; margin-top: 12px; width: fit-content; }
      .demo-grid { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 16px; }
      #native-fdc3-chat { height: 430px; }
      #native-fdc3-chat:empty { height: 0; }
      #native-fdc3-chat iframe { width: 100%; height: 100%; border: 0; }
      pre { margin: 0; overflow: auto; max-height: 430px; font-size: .8rem; white-space: pre-wrap; overflow-wrap: anywhere; }
      @media (max-width: 760px) {
        .demo-grid { grid-template-columns: minmax(0, 1fr); gap: 0; }
        .demo .actions button { width: 100%; }
      }
    </style>
    <script type="module" src="./demo.js"></script>
  </head>
  <body>
    <main class="demo">
      <h1>Native FDC3 action buttons</h1>
      <p>Send a chart check or synthetic trade actions to a Symphony test room.</p>
      <form id="setup" class="panel" aria-labelledby="setup-title">
        <h2 id="setup-title">Chat setup</h2>
        <fieldset id="setup-fields">
          <label>Pod hostname <input name="pod" placeholder="pod.example.com" autocapitalize="none" spellcheck="false" required></label>
          <label>Partner ID <input name="partnerId" placeholder="Optional in UAT" autocapitalize="none" spellcheck="false"></label>
          <label>Stream ID <input name="streamId" autocapitalize="none" spellcheck="false" required></label>
        </fieldset>
        <div class="actions">
          <button id="load-chat" class="primary-action">Load chat</button>
          <output id="sdk-status" class="setup-status" role="status">Chat disconnected</output>
        </div>
      </form>
      <section class="panel" aria-labelledby="send-title">
        <h2 id="send-title">Action messages</h2>
        <div class="actions">
          <button id="send-chart" class="primary-action" disabled>Send chart check</button>
          <button id="send-trade" class="secondary-action" disabled>Send trade actions</button>
          <button id="register-interop" class="secondary-action" disabled>Register host callback</button>
        </div>
        <label class="relay"><input id="relay" type="checkbox" disabled> Forward demo clicks through host FDC3</label>
        <output id="action-status" role="status"></output>
      </section>
      <div class="demo-grid">
        <section class="panel" aria-labelledby="chat-title">
          <h2 id="chat-title">Embedded chat</h2>
          <div id="native-fdc3-chat" class="native-fdc3-chat"></div>
        </section>
        <section class="panel" aria-labelledby="diagnostics-title">
          <h2 id="diagnostics-title">Diagnostics</h2>
          <pre id="diagnostics" tabindex="0" aria-labelledby="diagnostics-title">Load chat to start.</pre>
        </section>
      </div>
    </main>
  </body>
</html>
