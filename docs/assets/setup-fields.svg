<svg width="1280" height="760" viewBox="0 0 1280 760" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Annotated Symphony Embedded Mode setup form</title>
  <desc id="desc">An annotated mock of the local host page showing the values to enter for Pod URL, Partner ID, Stream ID, Theme, and Login.</desc>
  <rect width="1280" height="760" fill="#F3F4F6"/>
  <rect x="70" y="58" width="1140" height="644" rx="28" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="2"/>
  <rect x="70" y="58" width="1140" height="92" rx="28" fill="#111827"/>
  <circle cx="116" cy="104" r="18" fill="#10B981"/>
  <text x="150" y="98" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">Symphony Embedded Mode</text>
  <text x="150" y="126" fill="#D1D5DB" font-family="Arial, Helvetica, sans-serif" font-size="18">FDC3 Actions Demo</text>

  <text x="110" y="206" fill="#111827" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">1. Pod URL</text>
  <rect x="110" y="220" width="320" height="58" rx="14" fill="#F9FAFB" stroke="#CBD5E1" stroke-width="2"/>
  <text x="132" y="257" fill="#374151" font-family="Arial, Helvetica, sans-serif" font-size="22">company.symphony.com</text>

  <text x="462" y="206" fill="#111827" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">2. Partner ID</text>
  <rect x="462" y="220" width="240" height="58" rx="14" fill="#F9FAFB" stroke="#CBD5E1" stroke-width="2"/>
  <text x="484" y="257" fill="#374151" font-family="Arial, Helvetica, sans-serif" font-size="22">demo-partner-id</text>

  <text x="734" y="206" fill="#111827" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">3. Stream ID</text>
  <rect x="734" y="220" width="270" height="58" rx="14" fill="#F9FAFB" stroke="#CBD5E1" stroke-width="2"/>
  <text x="756" y="257" fill="#374151" font-family="Arial, Helvetica, sans-serif" font-size="18">abc123example-stream-id</text>

  <text x="1036" y="206" fill="#111827" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">4. Theme</text>
  <rect x="1036" y="220" width="120" height="58" rx="14" fill="#F9FAFB" stroke="#CBD5E1" stroke-width="2"/>
  <text x="1072" y="257" fill="#374151" font-family="Arial, Helvetica, sans-serif" font-size="22">Light</text>

  <text x="110" y="330" fill="#111827" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">5. Login</text>
  <rect x="110" y="344" width="190" height="58" rx="14" fill="#F9FAFB" stroke="#CBD5E1" stroke-width="2"/>
  <text x="166" y="381" fill="#374151" font-family="Arial, Helvetica, sans-serif" font-size="22">Popup</text>

  <rect x="976" y="334" width="180" height="68" rx="18" fill="#2563EB"/>
  <text x="1016" y="377" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">Load Chat</text>

  <rect x="110" y="456" width="520" height="182" rx="18" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <text x="132" y="490" fill="#111827" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">Payment Exceptions</text>
  <text x="132" y="526" fill="#6B7280" font-family="Arial, Helvetica, sans-serif" font-size="20">Click a row after chat loads to send a message with action buttons.</text>
  <text x="132" y="566" fill="#374151" font-family="Arial, Helvetica, sans-serif" font-size="20">Example row: EXC-1042  Acme Bank  USD 2,500,000  Escalate</text>

  <rect x="666" y="456" width="490" height="182" rx="18" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <text x="688" y="490" fill="#111827" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">Active Chat</text>
  <text x="688" y="526" fill="#6B7280" font-family="Arial, Helvetica, sans-serif" font-size="20">If this panel stays empty, fix connection and login first.</text>
  <text x="688" y="566" fill="#374151" font-family="Arial, Helvetica, sans-serif" font-size="20">The buttons only appear after a message is sent into a loaded stream.</text>

  <path d="M422 250 C500 160, 620 150, 720 205" stroke="#DC2626" stroke-width="4" stroke-linecap="round"/>
  <circle cx="720" cy="205" r="7" fill="#DC2626"/>
  <rect x="470" y="92" width="320" height="72" rx="16" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="2"/>
  <text x="492" y="122" fill="#991B1B" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">Enter only the hostname</text>
  <text x="492" y="148" fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="18">Use company.symphony.com, not https://company.symphony.com</text>

  <path d="M1090 402 C1105 438, 1115 472, 1110 506" stroke="#059669" stroke-width="4" stroke-linecap="round"/>
  <circle cx="1110" cy="506" r="7" fill="#059669"/>
  <rect x="932" y="580" width="278" height="78" rx="16" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="2"/>
  <text x="954" y="612" fill="#065F46" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">First successful milestone</text>
  <text x="954" y="638" fill="#047857" font-family="Arial, Helvetica, sans-serif" font-size="18">The Active Chat panel renders your target stream.</text>

  <rect x="110" y="654" width="678" height="28" rx="12" fill="#EEF2FF"/>
  <text x="126" y="674" fill="#3730A3" font-family="Arial, Helvetica, sans-serif" font-size="16">Tip: You can prefill these values from the URL query string and they will be cached in local storage.</text>
</svg>
